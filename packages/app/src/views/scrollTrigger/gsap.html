<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>视差滚动</title>
  <style>
    body {
      padding: 0 0;
      margin: 0 0;
    }

    div {
      color: white;
      font-size: 36px;
      text-align: center;
      line-height: 100vh;
    }

    section {
      width: 100%;
      height: 100vh;
      object-fit: contain;
      background-size: 100%;
      background-position: center center;
    }

    section:nth-child(1) {
      background: url('https://images.pexels.com/photos/417074/pexels-photo-417074.jpeg?auto=compress&cs=tinysrgb&w=1920&h=1080&fit=crop')no-repeat center;
    }

    section:nth-child(2) {
      background: url('https://images.pexels.com/photos/466685/pexels-photo-466685.jpeg?auto=compress&cs=tinysrgb&w=1920&h=1080&fit=crop')no-repeat center;
    }

    section:nth-child(3) {
      background: url('https://images.pexels.com/photos/1572386/pexels-photo-1572386.jpeg?auto=compress&cs=tinysrgb&w=1920&h=1080&fit=crop')no-repeat center;
    }
  </style>
</head>

<body>
  <section>
    <div>展示文字1</div>
  </section>
  <section>
    <div>展示文字2</div>
  </section>
  <section>
    <div>展示文字3</div>
  </section>
</body>
<script
  src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/16327/gsap-latest-beta.min.js"></script>
<script
  src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/16327/ScrollTrigger.min.js"></script>

<script>
  const section = document.querySelectorAll('section')

  gsap.registerPlugin(ScrollTrigger)

  const height = document.documentElement.clientHeight
  const width = document.documentElement.clientWidth

  console.log({
    height,
    width
  })

  section.forEach(section => {
    gsap.fromTo(section, {
      backgroundPositionY: `-${height / 2}px`
    }, {
      backgroundPositionY: `${height / 2}px`,
      // duration:3,
      ease: 'none',
      scrollTrigger: {
        trigger: section,
        scrub: true,
      }
    })
  })
</script>

</html>
